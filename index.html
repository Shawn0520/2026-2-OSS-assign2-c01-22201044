<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트 가전 관리 - 목록</title>
  <link rel="stylesheet" href="my.css">
</head>
<body>
  <header>
    <div class="container header-content">
      <h1>⚡ Smart Device Manager</h1>
      <nav><a href="index.html">홈</a></nav>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>등록된 가전 기기 목록</h2>
        <!-- [Add] 버튼: add.html로 이동 -->
        <a href="add.html" class="btn btn-primary">+ 기기 등록 (Add)</a>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <!-- 표시 Field: ID, 기기명, 카테고리, 상태, 상세보기 -->
              <th>ID</th>
              <th>기기명</th>
              <th>카테고리</th>
              <th>구매가격</th>
              <th>상태</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td>LG 오브제 스탠드 청소기</td>
              <td>생활가전</td>
              <td>1,200,000원</td>
              <td><span style="color: green;">정상 작동</span></td>
              <!-- 특정 데이터 클릭 시 view.html로 이동 -->
              <td><a href="view.html" class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.8rem;">상세보기</a></td>
            </tr>
            <tr>
              <td>2</td>
              <td>삼성 비스포크 식기세척기</td>
              <td>주방가전</td>
              <td>950,000원</td>
              <td><span style="color: orange;">수리 필요</span></td>
              <td><a href="view.html" class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.8rem;">상세보기</a></td>
            </tr>
            <tr>
              <td>3</td>
              <td>M2 맥북 프로 16인치</td>
              <td>IT/음향</td>
              <td>3,400,000원</td>
              <td><span style="color: green;">정상 작동</span></td>
              <td><a href="view.html" class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.8rem;">상세보기</a></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Smart Device Manager. All rights reserved.</p>
  </footer>
</body>
</html>
